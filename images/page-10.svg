<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600"><title>Le couloir sombre de l'étage, des portes à gauche ; le héros frappe doucement à la troisième porte. Toc, toc, toc.</title><desc>Illustration cartoon cell-shaded, contours épais violet-noir, aplats de couleurs avec une seule ombre dure par forme, palette nocturne violet et orange citrouille. Personnages récurrents : le héros déguisé en vampire (teint blafard, cheveux noirs en pointe, cape noire à col rouge, nœud papillon rouge), Mme Morticia / Yvonne (vieille dame, chignon blanc, robe prune, collier de perles avec une clé), Henri (vieil homme chauve, touffes et moustache blanches, gilet moutarde, cravate verte), Minou (chat noir aux yeux jaunes, médaillon doré).</desc><g fill="#2b2440" stroke="none" ><rect x="0" y="0" width="960" height="600" rx="0"/></g><g fill="#3a3152" stroke="none" ><polygon points="0,0 380,150 380,420 0,600"/></g><g fill="#332b49" stroke="none" ><polygon points="960,0 580,150 580,420 960,600"/></g><g fill="#5a3420" stroke="none" ><polygon points="0,600 380,420 580,420 960,600"/></g><g fill="#1f1932" stroke="none" ><polygon points="0,0 380,150 580,150 960,0"/></g><g fill="#2a2342" stroke="none" ><rect x="380" y="150" width="200" height="270" rx="0"/></g><clipPath id="c0"><rect x="430" y="190" width="100" height="130" rx="4"/></clipPath><g clip-path="url(#c0)" stroke="none"><g fill="#3b2012"><rect x="430" y="190" width="100" height="130" rx="4"/></g><g fill="#5a3420" transform="translate(-4,-4)"><rect x="430" y="190" width="100" height="130" rx="4"/></g></g><g fill="none" stroke="#1b1226" stroke-width="4" stroke-linejoin="round"><rect x="430" y="190" width="100" height="130" rx="4"/></g><g fill="#2b2150" stroke="none" ><rect x="440" y="200" width="80" height="110" rx="0"/></g><g fill="#1b1226" stroke="none" ><rect x="488.0" y="233.0" width="6" height="77.0" rx="0"/></g><g fill="#ffe9a0" stroke="none" ><ellipse cx="491.0" cy="230.8" rx="14" ry="14"/></g><d