<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600"><title>Le lendemain matin : deux petites marques de crocs sur le cou du héros et une carte des Morticia dans la boîte aux lettres.</title><desc>Affiche imprimée en risographie : dessin cartoon à contours épais réduit à six encres (violet nuit, prune, magenta, orange citrouille, pêche) sur papier crème, léger décalage de repérage, trame de demi-teinte et grain du papier. Personnages récurrents : le héros déguisé en vampire (teint blafard, cheveux noirs en pointe, cape noire à col rouge, nœud papillon rouge), Mme Morticia / Yvonne (vieille dame, chignon blanc, robe prune, collier de perles avec une clé), Henri (vieil homme chauve, touffes et moustache blanches, gilet moutarde, cravate verte), Minou (chat noir aux yeux jaunes, médaillon doré).</desc><defs><filter id="riso" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0.3 0.59 0.11 0 0  0.3 0.59 0.11 0 0  0.3 0.59 0.11 0 0  0 0 0 1 0" result="lum"/><feComponentTransfer in="lum" result="contrast"><feFuncR type="gamma" amplitude="1.05" exponent="0.62" offset="-0.02"/><feFuncG type="gamma" amplitude="1.05" exponent="0.62" offset="-0.02"/><feFuncB type="gamma" amplitude="1.05" exponent="0.62" offset="-0.02"/></feComponentTransfer><feComponentTransfer in="contrast" result="ink"><feFuncR type="discrete" tableValues="0.122 0.239 0.541 1.000 1.000 0.965"/><feFuncG type="discrete" tableValues="0.078 0.141 0.247 0.420 0.690 0.925"/><feFuncB type="discrete" tableValues="0.200 0.400 0.478 0.173 0.478 0.847"/></feComponentTransfer><feOffset in="ink" dx="3" dy="2" result="shift"/><feComposite in="shift" operator="arithmetic" k2="0.35" k4="0.65" result="ghost"/><feBlend in="ink" in2="ghost" mode="multiply" result="printed"/><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/><feColorMatrix in="noise" type="saturate" values="0" result="grey"/><