<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600"><title>Fin : la tasse fumante, le petit mot d'Yvonne et son ombre fantomatique.</title><desc>Affiche imprimée en risographie : dessin cartoon à contours épais réduit à six encres (violet nuit, prune, magenta, orange citrouille, pêche) sur papier crème, léger décalage de repérage, trame de demi-teinte et grain du papier. Personnages récurrents : le héros déguisé en vampire (teint blafard, cheveux noirs en pointe, cape noire à col rouge, nœud papillon rouge), Mme Morticia / Yvonne (vieille dame, chignon blanc, robe prune, collier de perles avec une clé), Henri (vieil homme chauve, touffes et moustache blanches, gilet moutarde, cravate verte), Minou (chat noir aux yeux jaunes, médaillon doré).</desc><defs><filter id="riso" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0.3 0.59 0.11 0 0  0.3 0.59 0.11 0 0  0.3 0.59 0.11 0 0  0 0 0 1 0" result="lum"/><feComponentTransfer in="lum" result="contrast"><feFuncR type="gamma" amplitude="1.05" exponent="0.62" offset="-0.02"/><feFuncG type="gamma" amplitude="1.05" exponent="0.62" offset="-0.02"/><feFuncB type="gamma" amplitude="1.05" exponent="0.62" offset="-0.02"/></feComponentTransfer><feComponentTransfer in="contrast" result="ink"><feFuncR type="discrete" tableValues="0.122 0.239 0.541 1.000 1.000 0.965"/><feFuncG type="discrete" tableValues="0.078 0.141 0.247 0.420 0.690 0.925"/><feFuncB type="discrete" tableValues="0.200 0.400 0.478 0.173 0.478 0.847"/></feComponentTransfer><feOffset in="ink" dx="3" dy="2" result="shift"/><feComposite in="shift" operator="arithmetic" k2="0.35" k4="0.65" result="ghost"/><feBlend in="ink" in2="ghost" mode="multiply" result="printed"/><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/><feColorMatrix in="noise" type="saturate" values="0" result="grey"/><feComposite in="printed" in2="grey" operator="arithmetic" k2="1" k3="0.16" k4="-0.08"/></filter><pattern id="halftone" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(22)"><circle cx="3" cy="3" r="1.3" fill="#3d2466"/></pattern><filter id="fibres"><feTurbulence type="fractalNoise" baseFrequency="0.35" numOctaves="3" seed="3"/><feColorMatrix values="0 0 0 0 0.24  0 0 0 0 0.14  0 0 0 0 0.4  0 0 0 -1.8 1"/></filter></defs><g filter="url(#riso)"><g fill="#1e2a3a" stroke="none" ><rect x="0" y="0" width="960" height="600" rx="0"/></g><g fill="#fff6d8" stroke="none" opacity="0.8"><ellipse cx="778" cy="275" rx="2.4" ry="2.4"/><ellipse cx="432" cy="529" rx="1.6" ry="1.6"/><ellipse cx="806" cy="303" rx="1.6" ry="1.6"/><ellipse cx="940" cy="557" rx="2.4" ry="2.4"/><ellipse cx="834" cy="451" rx="1.6" ry="1.6"/><ellipse cx="488" cy="465" rx="1.6" ry="1.6"/><ellipse cx="862" cy="599" rx="2.4" ry="2.4"/><ellipse cx="36" cy="493" rx="1.6" ry="1.6"/><ellipse cx="890" cy="507" rx="1.6" ry="1.6"/><ellipse cx="544" cy="41" rx="2.4" ry="2.4"/><ellipse cx="918" cy="535" rx="1.6" ry="1.6"/><ellipse cx="92" cy="549" rx="1.6" ry="1.6"/><ellipse cx="946" cy="563" rx="2.4" ry="2.4"/><ellipse cx="600" cy="337" rx="1.6" ry="1.6"/><ellipse cx="14" cy="471" rx="1.6" ry="1.6"/><ellipse cx="148" cy="5" rx="2.4" ry="2.4"/><ellipse cx="42" cy="379" rx="1.6" ry="1.6"/><ellipse cx="656" cy="153" rx="1.6" ry="1.6"/><ellipse cx="70" cy="167" rx="2.4" ry="2.4"/><ellipse cx="204" cy="301" rx="1.6" ry="1.6"/><ellipse cx="98" cy="435" rx="1.6" ry="1.6"/><ellipse cx="712" cy="209" rx="2.4" ry="2.4"/><ellipse cx="126" cy="103" rx="1.6" ry="1.6"/><ellipse cx="260" cy="117" rx="1.6" ry="1.6"/><ellipse cx="154" cy="491" rx="2.4" ry="2.4"/><ellipse cx="768" cy="25" rx="1.6" ry="1.6"/><ellipse cx="182" cy="159" rx="1.6" ry="1.6"/><ellipse cx="316" cy="173" rx="2.4" ry="2.4"/><ellipse cx="210" cy="547" rx="1.6" ry="1.6"/><ellipse cx="824" cy="201" rx="1.6" ry="1.6"/><ellipse cx="238" cy="215" rx="2.4" ry="2.4"/><ellipse cx="372" cy="109" 