name: Déployer sur GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Seule la branche par défaut met le site en ligne (les branches de PR ne l'écrasent pas).
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Régénérer l'histoire et les illustrations
        run: |
          python3 tools/build_story.py
          python3 tools/generate_images.py

      - name: Préparer le site
        run: |
          mkdir -p _site
          cp -r index.html style.css app.js story.js images _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
